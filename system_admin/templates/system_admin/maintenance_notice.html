<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance | StockFlow AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h1 { font-size: 1.8rem; margin-bottom: 12px; color: #ef4444; }
        p { color: #94a3b8; font-size: 1rem; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛠️ System Maintenance in Progress</h1>
        <p>{{ message }}</p>
        <a href="/login/" class="btn">Admin Login</a>
    </div>
</body>
</html>
