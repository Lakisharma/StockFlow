<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | StockFlow AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a, #020617);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon-badge {
            width: 64px;
            height: 64px;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .alert-box {
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-control {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
        }

        .footer-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="forgot-card">
        <div class="brand-header">
            <div class="icon-badge">
                <span class="material-icons-round" style="font-size: 32px;">lock_reset</span>
            </div>
            <h1 class="title">Reset Password</h1>
            <p class="subtitle">Enter your registered username or email to update your account password.</p>
        </div>

        {% if error %}
            <div class="alert-box alert-danger">
                <span class="material-icons-round">error</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        {% if message %}
            <div class="alert-box alert-success">
                <span class="material-icons-round">check_circle</span>
                <span>{{ message }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'forgot-password' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="identity">Username or Email Address</label>
                <input class="input-control" type="text" id="identity" name="identity" placeholder="e.g. admin or admin@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="new_password">New Password</label>
                <input class="input-control" type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password</label>
                <input class="input-control" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
            </div>

            <button class="btn-submit" type="submit">
                <span class="material-icons-round">vpn_key</span> Update Password
            </button>
        </form>

        <div class="footer-link">
            <a href="{% url 'login' %}">
                <span class="material-icons-round" style="font-size: 18px;">arrow_back</span> Back to Login
            </a>
        </div>
    </div>

</body>
</html>
